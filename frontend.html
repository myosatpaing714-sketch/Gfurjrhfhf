<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Corner Shop</title>
<style>
  :root { --bg:#fff8f0; --ink:#2a1b3d; --muted:#6b5b7b; --card:#fff; --accent:#7c5cff; --accent-ink:#fff; --line:#eadfd2; --ok:#1f8a4c; --err:#c0362c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17111f; --ink:#f3ecff; --muted:#b8a9cc; --card:#231a30; --line:#382a4a; --accent:#9b83ff; --accent-ink:#17111f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:16px 5vw; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .top h1 { margin:0; font-family:Georgia,serif; font-size:1.5rem; }
  button { font:inherit; cursor:pointer; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 16px; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  .count { background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:0 8px; margin-left:4px; }
  .hero { padding:48px 5vw 16px; }
  .hero h2 { font-family:Georgia,serif; font-size:clamp(2rem,6vw,3.5rem); margin:0 0 8px; }
  .hero p { color:var(--muted); margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; padding:24px 5vw 64px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px 24px 24px 8px; padding:20px; display:flex; flex-direction:column; gap:8px; transition:transform .2s; }
  .card:hover { transform:translateY(-4px); }
  .emoji { font-size:3.5rem; text-align:center; background:var(--bg); border-radius:18px; padding:12px 0; }
  .card h3 { margin:4px 0 0; }
  .card p { margin:0; color:var(--muted); font-size:.95rem; flex:1; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .price { font-weight:700; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:min(400px,100%); background:var(--bg); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .25s; z-index:10; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .drawer.open { transform:none; }
  .drawer-head { display:flex; justify-content:space-between; align-items:center; }
  .drawer-head h3 { margin:0; font-family:Georgia,serif; }
  .line { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .qty { display:flex; align-items:center; gap:6px; }
  .qty button { padding:2px 10px; }
  .total { font-size:1.2rem; text-align:right; }
  form { display:flex; flex-direction:column; gap:10px; }
  input { font:inherit; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  #msg { margin:0; min-height:1.4em; }
  #msg.ok { color:var(--ok); } #msg.err { color:var(--err); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>Cozy Corner</h1>
  <button id="cart-btn">🛒 Cart <span class="count" id="cart-count">0</span></button>
</header>

<main>
  <section class="hero">
    <h2>Small things for a nicer day.</h2>
    <p>Handpicked home and desk goods, delivered to your door.</p>
  </section>
  <section id="products" class="grid"></section>
</main>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head"><h3>Your cart</h3><button id="close-btn" aria-label="Close cart">✕</button></div>
  <div id="cart-items"></div>
  <div class="total">Total: <strong id="cart-total">$0.00</strong></div>
  <form id="checkout">
    <input name="name" placeholder="Your name" required>
    <input name="email" type="email" placeholder="Email" required>
    <button type="submit" class="primary">Place order</button>
    <p id="msg" role="status"></p>
  </form>
</aside>
<div id="overlay" class="overlay"></div>

<script>
  // If you open this file directly (not through the backend), keep this URL.
  // When served by backend.js you can set it to "" instead.
  const API = location.protocol === "file:" ? "http://localhost:3000" : "";

  const $ = (s) => document.querySelector(s);
  const money = (n) => "$" + n.toFixed(2);
  let products = [];
  let cart = {};
  try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch { cart = {}; }

  function save() { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch {} }

  async function loadProducts() {
    try {
      products = await (await fetch(API + "/api/products")).json();
      renderProducts();
      renderCart();
    } catch {
      $("#products").textContent = "Could not load products. Is the backend running?";
    }
  }

  function renderProducts() {
    $("#products").innerHTML = products.map((p) => `
      <article class="card">
        <div class="emoji" aria-hidden="true">${p.emoji}</div>
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="row">
          <span class="price">${money(p.price)}</span>
          <button class="primary" data-add="${p.id}">Add to cart</button>
        </div>
      </article>`).join("");
  }

  function renderCart() {
    const ids = Object.keys(cart).filter((id) => products.some((p) => p.id == id));
    let total = 0, count = 0;
    $("#cart-items").innerHTML = ids.length ? ids.map((id) => {
      const p = products.find((x) => x.id == id);
      const q = cart[id];
      total += p.price * q; count += q;
      return `<div class="line">
        <span>${p.emoji} ${p.name}<br><small>${money(p.price)}</small></span>
        <span class="qty"><button data-dec="${id}" aria-label="Less">−</button>${q}<button data-inc="${id}" aria-label="More">+</button></span>
      </div>`;
    }).join("") : "<p>Your cart is empty.</p>";
    $("#cart-total").textContent = money(total);
    $("#cart-count").textContent = count;
    save();
  }

  function openCart(open) {
    $("#drawer").classList.toggle("open", open);
    $("#overlay").classList.toggle("show", open);
    $("#drawer").setAttribute("aria-hidden", String(!open));
  }

  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.dataset.add) { cart[t.dataset.add] = (cart[t.dataset.add] || 0) + 1; renderCart(); }
    if (t.dataset.inc) { cart[t.dataset.inc] = Math.min(20, cart[t.dataset.inc] + 1); renderCart(); }
    if (t.dataset.dec) { cart[t.dataset.dec]--; if (cart[t.dataset.dec] <= 0) delete cart[t.dataset.dec]; renderCart(); }
    if (t.id === "cart-btn") openCart(true);
    if (t.id === "close-btn" || t.id === "overlay") openCart(false);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") openCart(false); });

  $("#checkout").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#msg");
    const items = Object.entries(cart).map(([id, qty]) => ({ id: Number(id), qty }));
    const form = new FormData(e.target);
    msg.className = ""; msg.textContent = "Sending...";
    try {
      const res = await fetch(API + "/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: form.get("name"), email: form.get("email"), items }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      cart = {}; renderCart(); e.target.reset();
      msg.className = "ok"; msg.textContent = "Thank you! Order #" + data.id + " placed. Total " + money(data.total) + ".";
    } catch (err) {
      msg.className = "err"; msg.textContent = err.message;
    }
  });

  loadProducts();
</script>
</body>
</html>
